# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: toniohypnose/toniohypnose-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/823719de-50b5-4c67-9311-de3bf9776b04/pkce
  auth_token_endpoint: /sites/823719de-50b5-4c67-9311-de3bf9776b04/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://toniohypnose.fr

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "fr"

collections:
  - name: "articles"
    label: "Articles du blog"
    files:
      - name: "articles"
        label: "Tous les articles"
        file: "content/articles.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{titre}} — {{date}}"
            fields:
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Date", name: "date", widget: "string", hint: "Écrivez la date comme vous voulez qu'elle s'affiche, ex : 17 juin 2026"}
              - label: "Catégorie"
                name: "categorie"
                widget: "select"
                options: ["Spectacle", "Thérapie", "Actualité", "Coulisses"]
              - {label: "Résumé", name: "resume", widget: "text", hint: "2 lignes max — affiché sur la carte d'aperçu"}
              - {label: "Photo", name: "photo", widget: "image", required: false, hint: "Optionnelle"}
              - {label: "ID vidéo YouTube", name: "youtube", widget: "string", required: false, hint: "Optionnel — juste l'identifiant dans l'URL, ex : S4DsDPrzpdk (pas l'URL complète)"}
              - {label: "Contenu", name: "contenu", widget: "text", hint: "Le texte complet de l'article. Sautez une ligne entre les paragraphes."}
